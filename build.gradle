

subprojects {
    apply plugin: 'java'

    group   = 'soundcontrol'
    version = '1.6.0'

    java {
        withSourcesJar()
    }

        tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    if (project.name != 'common') {
        tasks.withType(ProcessResources).configureEach {
            def crosshairTranslations = [
                'en_us': [
                    'key.soundcontrol.mute_looked_at': 'Mute/Unmute Targeted Block or Mob',
                    'message.soundcontrol.look_mute.none': 'No block or mob under the crosshair to mute.',
                    'message.soundcontrol.look_mute.muted': 'Muted: %s',
                    'message.soundcontrol.look_mute.unmuted': 'Unmuted: %s'
                ],
                'uk_ua': [
                    'key.soundcontrol.mute_looked_at': 'Приглушити/відновити звуки блока або моба під прицілом',
                    'message.soundcontrol.look_mute.none': 'Немає блока або моба під прицілом для приглушення.',
                    'message.soundcontrol.look_mute.muted': 'Звуки приглушено: %s',
                    'message.soundcontrol.look_mute.unmuted': 'Звуки відновлено: %s'
                ],
                'ru_ru': [
                    'key.soundcontrol.mute_looked_at': 'Приглушить/восстановить звуки блока или моба под прицелом',
                    'message.soundcontrol.look_mute.none': 'Нет блока или моба под прицелом для приглушения.',
                    'message.soundcontrol.look_mute.muted': 'Звуки приглушены: %s',
                    'message.soundcontrol.look_mute.unmuted': 'Звуки восстановлены: %s'
                ]
            ]
            inputs.property('crosshairTranslations', crosshairTranslations)
            filteringCharset = 'UTF-8'

            doLast {
                fileTree(destinationDir).matching {
                    include 'assets/soundcontrol/lang/*.json'
                }.each { languageFile ->
                    def locale = languageFile.name.replace('.json', '')
                    def translations = new groovy.json.JsonSlurper().parseText(languageFile.getText('UTF-8').replace('\uFEFF', ''))
                    translations.putAll(crosshairTranslations[locale] ?: crosshairTranslations.en_us)
                    languageFile.setText(groovy.json.JsonOutput.prettyPrint(
                            groovy.json.JsonOutput.toJson(translations)), 'UTF-8')
                }
            }
        }
    }

    repositories {
        mavenCentral()
        maven { name = 'Fabric';         url = 'https://maven.fabricmc.net/' }
        maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/' }
        maven { name = 'NeoForged';      url = 'https://maven.neoforged.net/releases' }
    }
}
