pluginManagement {
    repositories {
        maven { name = 'Fabric';    url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

include 'fabric-1.20.1'
include 'fabric-1.21'
include 'fabric-1.21.2'
include 'fabric-1.21.4'
include 'fabric-1.21.6'
include 'fabric-1.21.9'
include 'fabric-26.1'
include 'fabric-26.2'
include 'fabric-26.3'

include 'neoforge-1.20.1'
include 'neoforge-1.21.1'
include 'neoforge-1.21.9'
include 'neoforge-1.21.10'
include 'neoforge-1.21.11'
include 'neoforge-26.1'
include 'neoforge-26.2'
include 'neoforge-26.3'

rootProject.name = 'soundcontrol'
