// fabric-1.21.4/build.gradle
plugins {
    id 'fabric-loom' version '1.15.5'
}

version = "1.4.2-1.21.4"

base {
    archivesName = "soundcontrol-fabric-1.21.4"
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.4"
    mappings  "net.fabricmc:yarn:1.21.4+build.2:v2"
    modImplementation "net.fabricmc:fabric-loader:0.18.4"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.119.4+1.21.4"
    modCompileOnly   "com.terraformersmc:modmenu:13.0.0"

    implementation project(':common')

    // Вбудовуємо common класи прямо в JAR
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from project(':common').sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
