// fabric-26.2/build.gradle
plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = "1.4.2-26.2"

base {
    archivesName = "soundcontrol-fabric-26.2"
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/" }
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.152.1+26.2"
    implementation "com.terraformersmc:modmenu:20.0.0-beta.2"

    // Спільний код
    implementation project(':common')
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

java {
    withSourcesJar()
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

jar {
    from project(':common').sourceSets.main.output
    from(rootProject.file('LICENSE')) { rename { 'LICENSE' } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
