// fabric-1.21.9/build.gradle
plugins {
    id 'fabric-loom' version '1.15.5'
}

version = "1.4.2-1.21.9"

base {
    archivesName = "soundcontrol-fabric-1.21.9"
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.9"
    mappings  "net.fabricmc:yarn:1.21.9+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.18.4"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.134.1+1.21.9"
    modCompileOnly   "com.terraformersmc:modmenu:14.0.0"

    implementation project(':common')

    // Вбудовуємо common класи прямо в JAR
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from project(':common').sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
