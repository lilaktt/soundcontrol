modLoader="javafml"
loaderVersion="[11,)"
license="Apache-2.0"

[[mods]]
displayTest="IGNORE_ALL_VERSION"
modId="soundcontrol"
version="${version}"
iconFile="assets/soundcontrol/icon.png"
displayName="${mod_name}"
authors="lilaktt"
description="Total control over Minecraft's audio. Mute annoying sounds, adjust individual volumes, mark favorites, and track audio with a built-in radar."
displayURL="https://modrinth.com/mod/sound_control"
issuesURL="https://github.com/lilaktt/soundcontrol/issues"
sourcesURL="https://github.com/lilaktt/soundcontrol"

[[mixins]]
config="soundcontrol.mixins.json"

[[dependencies.soundcontrol]]
    modId="neoforge"
    type="required"
    versionRange="[26.3,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.soundcontrol]]
    modId="minecraft"
    type="required"
    versionRange="[26.3,26.4)"
    ordering="NONE"
    side="CLIENT"
