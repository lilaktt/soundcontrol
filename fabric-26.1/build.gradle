
plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = "1.4.2-26.1"

base {
    archivesName = "soundcontrol-fabric-26.1"
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/" }
}

dependencies {
    minecraft "com.mojang:minecraft:26.1.1"
    implementation "net.fabricmc:fabric-loader:0.18.6"
    implementation "net.fabricmc.fabric-api:fabric-api:0.145.3+26.1.1"
    implementation "com.terraformersmc:modmenu:18.0.0-alpha.8"

    
    implementation project(':common')

    
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}



java {
    withSourcesJar()
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

jar {
    from project(':common').sourceSets.main.output
    from(rootProject.file('LICENSE')) { rename { 'LICENSE' } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
