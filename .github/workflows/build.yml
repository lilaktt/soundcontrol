name: Build Mod

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Gradle runs on 25; the 1.20.1 and 1.21.x modules get their Java 17/21 toolchains from the foojay resolver.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --continue

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Jars-${{ github.ref_name }}
          path: '*/build/libs/*.jar'
