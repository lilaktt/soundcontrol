plugins {
    id 'fabric-loom' version '1.15.5'
}

version = "1.5.1-1.21.3"

base {
    archivesName = "soundcontrol-fabric-1.21.3"
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.3"
    mappings  "net.fabricmc:yarn:1.21.3+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.108.0+1.21.3"
    modCompileOnly   "com.terraformersmc:modmenu:12.0.0-beta.1"

    implementation project(':common')
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from project(':common').sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}